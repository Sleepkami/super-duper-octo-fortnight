<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>涅尔卡密</title>
    <link rel="icon" href="favicon.png"></svg>">
    <style>
        :root {
            --bg: #000000;
            --text: #d0d0d0;
            --text-dim: #6a6a6a;
            --border: #2a2a2a;
            --border-hover: #4a4a4a;
            --fire: #e02d2d;
            --water: #4c60e0;
            --earth: #e09a02;
            --wind: #46e0b5;
            --aether: #d5e0d8;
            --void: #3b017d;
            --font-serif: "Noto Serif SC", "STSong", "Songti SC", "SimSun", "KaiTi", serif;
            --font-sans: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%; height: 100%;
            background: #000;
            font-family: var(--font-serif);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* 加载界面 */
        #loadingScreen {
            position: fixed; inset: 0; z-index: 100;
            background: #000;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            transition: opacity 1s ease;
            opacity: 1;
        }
        #loadingScreen.hidden { opacity: 0; pointer-events: none; }
        .loading-title {
            font-size: clamp(2.4rem, 5vw, 3.6rem);
            font-weight: 400; letter-spacing: 0.35em;
            color: #c8c8c8; margin-bottom: 2rem;
        }
        .progress-bar-bg {
            width: 260px; height: 2px;
            background: #1f1f1f;
            margin-bottom: 1.5rem;
        }
        .progress-bar-fill {
            height: 100%; width: 0%;
            background: #c8c8c8;
            transition: width 0.2s ease;
        }
        .loading-hint {
            font-size: 0.9rem; letter-spacing: 0.15em;
            color: #4a4a4a; font-style: italic;
        }

        /* 呼吸层 */
        #breathOverlay {
            position: fixed; inset: 0; z-index: 0;
            pointer-events: none; opacity: 0;
            transition: opacity 2s ease;
            animation: colorBreath 30s ease-in-out infinite;
        }
        #breathOverlay.active { opacity: 1; }

        @keyframes colorBreath {
            0%   { background-color: #0e011c; }
            15%  { background-color: #011524; }
            30%  { background-color: #17001e; }
            45%  { background-color: #012020; }
            60%  { background-color: #1f011c; }
            75%  { background-color: #100022; }
            90%  { background-color: #011520; }
            100% { background-color: #0e011c; }
        }

        #flashOverlay {
            position: fixed; inset: 0; z-index: 1;
            pointer-events: none; background: transparent;
            transition: background-color 2s ease;
        }

        .audio-control {
            position: fixed; top: 20px; right: 20px; z-index: 20;
            background: rgba(0,0,0,0.5); border: 1px solid #2a2a2a;
            width: 40px; height: 40px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: border-color 0.4s, box-shadow 0.4s;
        }
        .audio-control:hover { border-color: #5a5a5a; box-shadow: 0 0 15px rgba(100,100,100,0.1); }
        .audio-control svg { width: 18px; height: 18px; fill: #8a8a8a; }
        .audio-control.muted .play-icon,
        .audio-control:not(.muted) .mute-icon { display: none; }
        .audio-control.muted .mute-icon,
        .audio-control:not(.muted) .play-icon { display: block; }

        #mainContainer {
            position: relative; z-index: 2;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; padding: 3rem 1.5rem 2rem;
            opacity: 0; transition: opacity 0.5s ease;
        }
        #mainContainer.visible { opacity: 1; }

        .title {
            font-size: clamp(2.4rem, 5vw, 3.6rem);
            font-weight: 400; letter-spacing: 0.35em;
            color: #c8c8c8; margin-bottom: 0.3rem;
            position: relative; display: inline-block;
        }
        .title::before, .title::after {
            content: ''; position: absolute; left: 50%; transform: translateX(-50%);
            width: 60px; height: 1px; background: #3a3a3a;
        }
        .title::before { top: -14px; }
        .title::after { bottom: -14px; }

        .subtitle-ornament {
            width: 18px; height: 18px; margin: 1.8rem auto 2.2rem;
            position: relative; opacity: 0.5;
        }
        .subtitle-ornament::before, .subtitle-ornament::after {
            content: ''; position: absolute; background: #3a3a3a;
        }
        .subtitle-ornament::before {
            width: 100%; height: 1px; top: 50%; left: 0;
            transform: translateY(-50%) rotate(45deg);
        }
        .subtitle-ornament::after {
            width: 1px; height: 100%; left: 50%; top: 0;
            transform: translateX(-50%) rotate(45deg);
        }

        #inputSection {
            display: flex; flex-direction: column; align-items: center;
            width: 100%; max-width: 420px;
            transition: opacity 0.5s, transform 0.5s, max-height 0.6s;
            overflow: hidden; max-height: 300px; opacity: 1; transform: translateY(0);
        }
        #inputSection.hidden {
            opacity: 0; transform: translateY(-20px); max-height: 0;
            pointer-events: none;
        }
        .input-wrapper { width: 100%; margin-bottom: 1.6rem; }
        #questionInput {
            width: 100%; background: transparent; border: none;
            border-bottom: 1px solid #2e2e2e;
            padding: 0.9rem 0.5rem 0.7rem;
            font-family: var(--font-serif); font-size: 1.05rem;
            color: #c8c8c8; text-align: center; letter-spacing: 0.06em;
            outline: none; caret-color: #7a7a7a;
        }
        #questionInput::placeholder { color: #3e3e3e; font-style: italic; }
        #questionInput:focus { border-bottom-color: #5a5a5a; }
        #submitBtn {
            background: transparent; border: 1px solid #2e2e2e;
            color: #8a8a8a; font-family: var(--font-serif);
            font-size: 1rem; letter-spacing: 0.2em;
            padding: 0.55rem 2.4rem; cursor: pointer;
            transition: all 0.4s ease;
        }
        #submitBtn:hover { border-color: #5a5a5a; color: #c8c8c8; }

        #cardsSection {
            display: flex; flex-direction: column; align-items: center;
            gap: 1.4rem; width: 100%; max-width: 420px; margin-top: 1.8rem;
        }
        .card {
            width: 100%; border: 1px solid #1f1f1f;
            padding: 1.4rem 1.2rem 1.6rem; cursor: pointer;
            position: relative; transition: border-color 0.5s, box-shadow 0.5s;
            background: rgba(0,0,0,0.6);
            display: flex; flex-direction: column; align-items: center;
        }
        .card:hover { border-color: #3a3a3a; }
        .card.revealed { cursor: default; border-color: #2a2a2a; }
        .card-label {
            font-family: var(--font-sans); font-size: 0.7rem;
            letter-spacing: 0.25em; color: #4a4a4a; margin-bottom: 0.7rem;
        }
        .card-content {
            font-size: 1.5rem; letter-spacing: 0.12em;
            color: transparent; min-height: 2.2rem;
            display: flex; flex-direction: column; align-items: center;
            width: 100%; text-align: center;
            position: relative;
        }
        .card-content.revealing .word-text {
            animation: wordReveal 2s ease-out forwards;
        }
        .card-content.revealed-word .word-text { color: #ffffff; }
        .word-text { position: relative; z-index: 1; }

        .word-meaning {
            font-size: 0.7rem; color: #4a4a4a; margin-top: 0.5rem;
            opacity: 0; transform: translateY(5px);
            transition: opacity 0.8s, transform 0.8s;
            font-style: italic; max-width: 90%;
        }
        .word-meaning.visible { opacity: 0.7; transform: translateY(0); }

        .card-placeholder {
            width: 10px; height: 10px; position: absolute;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            opacity: 0.35;
        }
        .card-placeholder::before {
            content: ''; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 6px; height: 6px; border: 1px solid #3a3a3a; border-radius: 50%;
        }
        .card.revealed .card-placeholder { opacity: 0; }

        @keyframes wordReveal {
            0% { opacity:0; filter:blur(12px); transform:translateY(10px); color:transparent; }
            35% { opacity:0.45; filter:blur(6px); transform:translateY(4px); color:rgba(255,255,255,0.5); }
            70% { opacity:0.85; filter:blur(2px); transform:translateY(1px); color:rgba(255,255,255,0.9); }
            100% { opacity:1; filter:blur(0); transform:translateY(0); color:#ffffff; }
        }

        /* 双词动画相关 */
        .dual-words {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.2rem; /* 分开后的间距 */
            width: 100%;
            position: relative;
        }
        .dual-word {
            transition: transform 1s ease, opacity 1s ease;
        }
        .dual-word.stacked {
            position: absolute;
            opacity: 0.5;
            /* 初始重合：都定位到中心 */
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }
        .dual-word.separated {
            position: relative;
            opacity: 1;
            left: auto;
            top: auto;
            transform: none;
        }

        #interpretSection {
            width: 100%; max-width: 420px; margin-top: 1.8rem;
            display: none; flex-direction: column; align-items: center;
        }
        #interpretBtn {
            background: transparent; border: 1px solid #2e2e2e;
            color: #8a8a8a; font-family: var(--font-serif);
            font-size: 0.9rem; letter-spacing: 0.2em;
            padding: 0.5rem 2rem; cursor: pointer;
            transition: all 0.4s ease;
        }
        #interpretBtn:hover { border-color: #5a5a5a; color: #c8c8c8; }
        #interpretBtn:disabled { opacity: 0.4; cursor: not-allowed; }

        #interpretResult {
            width: 100%; margin-top: 1.5rem;
            border: 1px solid #1f1f1f; padding: 1.2rem;
            color: #b0b0b0; font-size: 0.9rem;
            line-height: 1.7; letter-spacing: 0.05em;
            white-space: pre-wrap; text-align: left;
            min-height: 60px; display: none;
        }

        #resetSection {
            opacity: 0; transform: translateY(10px); pointer-events: none;
            transition: opacity 0.6s, transform 0.6s; margin-top: 1.8rem;
        }
        #resetSection.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
        #resetBtn {
            background: transparent; border: 1px solid #1f1f1f;
            color: #5a5a5a; font-family: var(--font-serif);
            font-size: 0.85rem; letter-spacing: 0.18em;
            padding: 0.5rem 2rem; cursor: pointer;
        }

        .bottom-ornament {
            margin-top: 2.5rem; width: 40px; height: 1px;
            background: #1f1f1f; opacity: 0.6;
        }

        @media (max-width: 480px) {
            #mainContainer { padding: 2rem 1rem 1.5rem; }
            .card { padding: 1.1rem 0.9rem 1.3rem; min-height: 90px; }
            .card-content { font-size: 1.3rem; }
            .word-meaning { font-size: 0.65rem; }
            #questionInput { font-size: 0.95rem; }
            .title { font-size: 2rem; letter-spacing: 0.28em; }
        }
    </style>
</head>
<body>
    <div id="loadingScreen">
        <h1 class="loading-title">涅尔卡密</h1>
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
        <p class="loading-hint" id="loadingHint">群星正在归位...</p>
    </div>

    <div id="breathOverlay"></div>
    <div id="flashOverlay"></div>

    <audio id="bgm" loop preload="auto">
        <source src="bgm.mp3" type="audio/mpeg">
    </audio>
    <div class="audio-control" id="audioToggle" title="音乐开关">
        <svg class="play-icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        <svg class="mute-icon" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
    </div>

    <div id="mainContainer">
        <h1 class="title">涅尔卡密</h1>
        <div class="subtitle-ornament"></div>

        <div id="inputSection">
            <div class="input-wrapper">
                <input type="text" id="questionInput" placeholder="询问伟大的命运之星..." maxlength="120" autocomplete="off">
            </div>
            <button id="submitBtn">询问</button>
        </div>

        <div id="cardsSection"></div>

        <div id="interpretSection">
            <button id="interpretBtn">解读</button>
            <div id="interpretResult"></div>
        </div>

        <div id="resetSection">
            <button id="resetBtn">询问别的事情</button>
        </div>

        <div class="bottom-ornament"></div>
    </div>

    <script>
        (function() {
            const INTERPRET_API_URL = 'https://divination-api.vercel.app/api/interpret';

            const loadingScreen = document.getElementById('loadingScreen');
            const progressFill = document.getElementById('progressFill');
            const loadingHint = document.getElementById('loadingHint');
            const mainContainer = document.getElementById('mainContainer');
            const breathOverlay = document.getElementById('breathOverlay');
            const flashOverlay = document.getElementById('flashOverlay');
            const inputSection = document.getElementById('inputSection');
            const questionInput = document.getElementById('questionInput');
            const submitBtn = document.getElementById('submitBtn');
            const cardsSection = document.getElementById('cardsSection');
            const interpretSection = document.getElementById('interpretSection');
            const interpretBtn = document.getElementById('interpretBtn');
            const interpretResult = document.getElementById('interpretResult');
            const resetSection = document.getElementById('resetSection');
            const resetBtn = document.getElementById('resetBtn');
            const bgm = document.getElementById('bgm');
            const audioToggle = document.getElementById('audioToggle');

            let wordsData = [];
            let drawnWords = [];
            let starMovingData = { position: null, words: null };
            let revealedCount = 0;
            let isQuestionAsked = false;
            let activeFlashTimer = null;
            let audioStarted = false;

            let jsonLoaded = false;
            let jsonFailed = false;
            let bgmReady = false;
            let bgmFailed = false;

            function updateProgress(percent) { progressFill.style.width = Math.min(100, percent) + '%'; }

            function checkAllReady() {
                if (jsonFailed) { loadingHint.textContent = '星位紊乱，请刷新重试'; return; }
                if (jsonLoaded && bgmReady) {
                    updateProgress(100);
                    loadingHint.textContent = '星位已定';
                    setTimeout(() => {
                        loadingScreen.classList.add('hidden');
                        mainContainer.classList.add('visible');
                        breathOverlay.classList.add('active');
                    }, 600);
                }
            }

            fetch('words.json')
                .then(res => res.json())
                .then(data => { wordsData = data; jsonLoaded = true; updateProgress(30); checkAllReady(); })
                .catch(() => { jsonFailed = true; loadingHint.textContent = '星位紊乱，请刷新重试'; updateProgress(0); });

            bgm.addEventListener('progress', () => {
                if (bgm.buffered.length > 0 && jsonLoaded) {
                    const end = bgm.buffered.end(bgm.buffered.length - 1);
                    if (bgm.duration && bgm.duration > 0) {
                        const percent = 30 + (end / bgm.duration) * 70;
                        updateProgress(Math.min(100, percent));
                        if (percent >= 99 && !bgmReady) { bgmReady = true; checkAllReady(); }
                    }
                }
            });
            bgm.addEventListener('canplaythrough', () => { if (!bgmReady && !bgmFailed) { bgmReady = true; updateProgress(100); checkAllReady(); } });
            bgm.addEventListener('error', () => { if (!bgmFailed) { bgmFailed = true; bgmReady = true; loadingHint.textContent = '背景音乐加载失败，但星位仍在...'; updateProgress(100); checkAllReady(); } });

            function tryAutoPlay() { bgm.play().then(() => { audioStarted = true; audioToggle.classList.remove('muted'); }).catch(() => audioToggle.classList.add('muted')); }
            document.addEventListener('click', function resume() { if (!audioStarted) { bgm.play().then(() => { audioStarted = true; audioToggle.classList.remove('muted'); }).catch(()=>{}); } document.removeEventListener('click', resume); }, { once: true });
            audioToggle.addEventListener('click', (e) => { e.stopPropagation(); if (bgm.paused) { bgm.play().then(() => { audioStarted = true; audioToggle.classList.remove('muted'); }).catch(()=>{}); } else { bgm.pause(); audioToggle.classList.add('muted'); } });

            function getRandomWord() { return wordsData[Math.floor(Math.random() * wordsData.length)]; }
            function drawThreeWords() {
                const words = [getRandomWord(), getRandomWord(), getRandomWord()];
                starMovingData = { position: null, words: null };
                for (let i = 0; i < 3; i++) {
                    if (Math.random() < 0.07) {
                        const first = words[i];
                        const sameElem = wordsData.filter(w => w.element === first.element && w.name !== first.name);
                        if (sameElem.length > 0) {
                            const second = sameElem[Math.floor(Math.random() * sameElem.length)];
                            starMovingData = { position: i, words: [first, second] };
                            words[i] = { type: 'pair', words: [first, second], element: first.element, color: first.color };
                            break;
                        }
                    }
                }
                return words;
            }

            function triggerFlash(colorHex) {
                if (activeFlashTimer) clearTimeout(activeFlashTimer);
                flashOverlay.style.transition = 'none';
                flashOverlay.style.backgroundColor = hexToRgba(colorHex, 0.22);
                void flashOverlay.offsetWidth;
                flashOverlay.style.transition = 'background-color 2s ease';
                flashOverlay.style.backgroundColor = 'transparent';
                activeFlashTimer = setTimeout(() => activeFlashTimer = null, 2100);
            }
            function hexToRgba(hex, a) { const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16); return `rgba(${r},${g},${b},${a})`; }

            function createCards() {
                cardsSection.innerHTML = '';
                revealedCount = 0;
                ['本因', '进行', '指引'].forEach((label, i) => {
                    const card = document.createElement('div'); card.className = 'card';
                    card.innerHTML = `
                        <span class="card-label">${label}</span>
                        <div class="card-content">
                            <div class="word-text"></div>
                            <span class="word-meaning"></span>
                            <div class="card-placeholder"></div>
                        </div>`;
                    card.addEventListener('click', () => revealCard(i, card));
                    cardsSection.appendChild(card);
                });
            }

            function revealCard(index, card) {
                if (!isQuestionAsked || card.classList.contains('revealed')) return;
                card.classList.add('revealed');
                const w = drawnWords[index];
                const color = w.color;
                card.querySelector('.card-placeholder').remove();
                const contentEl = card.querySelector('.card-content');
                contentEl.style.setProperty('--glow-color', color);
                triggerFlash(color);

                const wordTextContainer = contentEl.querySelector('.word-text');
                const meaningEl = contentEl.querySelector('.word-meaning');

                if (w.type === 'pair') {
                    // 构建双词结构
                    wordTextContainer.innerHTML = ''; // 清空默认文本
                    const dualWordsDiv = document.createElement('div');
                    dualWordsDiv.className = 'dual-words';

                    const word1 = document.createElement('span');
                    word1.className = 'dual-word stacked'; // 初始重合
                    word1.textContent = w.words[0].name;

                    const word2 = document.createElement('span');
                    word2.className = 'dual-word stacked';
                    word2.textContent = w.words[1].name;

                    dualWordsDiv.appendChild(word1);
                    dualWordsDiv.appendChild(word2);
                    wordTextContainer.appendChild(dualWordsDiv);

                    // 1秒后分开
                    setTimeout(() => {
                        word1.classList.remove('stacked');
                        word1.classList.add('separated');
                        word2.classList.remove('stacked');
                        word2.classList.add('separated');
                    }, 1000);

                    meaningEl.textContent = w.words[0].meaning + ' / ' + w.words[1].meaning;
                } else {
                    wordTextContainer.textContent = w.name;
                    meaningEl.textContent = w.meaning;
                    // 普通单词语浮动动画
                    contentEl.classList.add('revealing');
                    wordTextContainer.style.animation = 'wordReveal 2s ease-out forwards';
                }

                const onAnimEnd = () => {
                    if (w.type !== 'pair') {
                        wordTextContainer.removeEventListener('animationend', onAnimEnd);
                        contentEl.classList.remove('revealing');
                        contentEl.classList.add('revealed-word');
                    }
                    revealedCount++;
                    if (revealedCount === 3) {
                        resetSection.classList.add('visible');
                        interpretSection.style.display = 'flex';
                        interpretResult.style.display = 'none';
                        interpretBtn.disabled = false;
                    }
                };
                if (w.type !== 'pair') {
                    wordTextContainer.addEventListener('animationend', onAnimEnd);
                } else {
                    // 双词没有标准动画，直接计数
                    setTimeout(onAnimEnd, 1500); // 给分开动画留足时间
                }

                setTimeout(() => { meaningEl.classList.add('visible'); }, 4200);
            }

            async function getInterpretation() {
                const question = questionInput.value.trim() || '未写下具体问题';
                const wordsForApi = drawnWords.map((w) => {
                    if (w.type === 'pair') {
                        return {
                            name: w.words[0].name + '·' + w.words[1].name,
                            meaning: w.words[0].meaning + ' / ' + w.words[1].meaning,
                            element: w.element,
                            order_type: w.words[0].order_type
                        };
                    }
                    return { name: w.name, meaning: w.meaning, element: w.element, order_type: w.order_type };
                });

                const elements = wordsForApi.map(w => w.element);
                const unique = [...new Set(elements)];
                let elementType = 'all_different';
                if (unique.length === 1) elementType = 'single';
                else if (unique.length === 2) elementType = 'pair_plus_one';

                const elementAnalysis = { type: elementType, elements: elements, dominant_element: elementType === 'single' ? elements[0] : null };
                const apiStarMoving = starMovingData.position !== null ? { position: starMovingData.position, words: starMovingData.words.map(w => ({ name: w.name, meaning: w.meaning })) } : { position: null, words: null };

                interpretBtn.disabled = true;
                interpretBtn.textContent = '解读中...';
                interpretResult.style.display = 'block';
                interpretResult.textContent = '正在聆听宇宙的絮语…';
                try {
                    const res = await fetch(INTERPRET_API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ question, words: wordsForApi, elementAnalysis, starMoving: apiStarMoving })
                    });
                    if (!res.ok) throw new Error('解读失败');
                    const data = await res.json();
                    interpretResult.textContent = data.choices[0].message.content;
                } catch (e) {
                    interpretResult.textContent = '解读暂时无法抵达，请稍后重试。';
                } finally {
                    interpretBtn.disabled = false;
                    interpretBtn.textContent = '解读';
                }
            }

            function startDivination() {
                if (!jsonLoaded || jsonFailed) return;
                drawnWords = drawThreeWords();
                isQuestionAsked = true;
                breathOverlay.classList.remove('active');
                inputSection.classList.add('hidden');
                createCards();
                resetSection.classList.remove('visible');
                interpretSection.style.display = 'none';
            }
            function resetDivination() {
                isQuestionAsked = false;
                createCards();
                inputSection.classList.remove('hidden');
                resetSection.classList.remove('visible');
                interpretSection.style.display = 'none';
                interpretResult.style.display = 'none';
                questionInput.value = '';
                breathOverlay.classList.add('active');
                if (activeFlashTimer) clearTimeout(activeFlashTimer);
                flashOverlay.style.backgroundColor = 'transparent';
                setTimeout(() => questionInput.focus(), 500);
            }

            submitBtn.addEventListener('click', startDivination);
            questionInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); startDivination(); } });
            resetBtn.addEventListener('click', resetDivination);
            interpretBtn.addEventListener('click', getInterpretation);

            createCards();
            mainContainer.classList.remove('visible');
        })();
    </script>
</body>
</html>
