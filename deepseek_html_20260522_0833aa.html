<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>涅尔卡密</title>
    <style>
        :root {
            --bg: #000000;
            --text: #d0d0d0;
            --text-dim: #6a6a6a;
            --border: #2a2a2a;
            --border-hover: #4a4a4a;
            --fire: #e02d2d;
            --water: #4c60e0;
            --earth: #e09a02;
            --wind: #46e0b5;
            --aether: #d5e0d8;
            --void: #3b017d;
            --font-serif: "Noto Serif SC", "STSong", "Songti SC", "SimSun", "KaiTi", serif;
            --font-sans: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: var(--bg);
            font-family: var(--font-serif);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
            transition: background-color 0.15s ease;
        }

        /* 背景覆盖层 */
        #flashOverlay {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background: transparent;
            transition: background-color 2s ease;
            will-change: background-color;
        }

        /* 音频控制按钮 - 右上角 */
        .audio-control {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 20;
            background: rgba(0,0,0,0.5);
            border: 1px solid #2a2a2a;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .audio-control:hover {
            border-color: #5a5a5a;
            box-shadow: 0 0 15px rgba(100,100,100,0.1);
        }
        .audio-control svg {
            width: 18px;
            height: 18px;
            fill: #8a8a8a;
            transition: fill 0.3s ease;
        }
        .audio-control.muted svg.play-icon,
        .audio-control:not(.muted) svg.mute-icon {
            display: none;
        }
        .audio-control.muted svg.mute-icon {
            display: block;
        }
        .audio-control:not(.muted) svg.play-icon {
            display: block;
        }

        /* 主容器 */
        #mainContainer {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 3rem 1.5rem 2rem;
        }

        /* 标题 */
        .title {
            font-size: clamp(2.4rem, 5vw, 3.6rem);
            font-weight: 400;
            letter-spacing: 0.35em;
            color: #c8c8c8;
            margin-bottom: 0.3rem;
            user-select: none;
            position: relative;
            display: inline-block;
        }
        .title::before,
        .title::after {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 1px;
            background: #3a3a3a;
        }
        .title::before {
            top: -14px;
        }
        .title::after {
            bottom: -14px;
        }

        /* 副标题装饰 */
        .subtitle-ornament {
            width: 18px;
            height: 18px;
            margin: 1.8rem auto 2.2rem;
            position: relative;
            opacity: 0.5;
        }
        .subtitle-ornament::before,
        .subtitle-ornament::after {
            content: '';
            position: absolute;
            background: #3a3a3a;
        }
        .subtitle-ornament::before {
            width: 100%;
            height: 1px;
            top: 50%;
            left: 0;
            transform: translateY(-50%) rotate(45deg);
        }
        .subtitle-ornament::after {
            width: 1px;
            height: 100%;
            left: 50%;
            top: 0;
            transform: translateX(-50%) rotate(45deg);
        }

        /* 输入区域 */
        #inputSection {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 420px;
            transition: opacity 0.5s ease, transform 0.5s ease, max-height 0.6s ease;
            overflow: hidden;
            max-height: 300px;
            opacity: 1;
            transform: translateY(0);
        }
        #inputSection.hidden {
            opacity: 0;
            transform: translateY(-20px);
            max-height: 0;
            margin-bottom: 0;
            pointer-events: none;
        }
        .input-wrapper {
            width: 100%;
            position: relative;
            margin-bottom: 1.6rem;
        }
        #questionInput {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid #2e2e2e;
            padding: 0.9rem 0.5rem 0.7rem;
            font-family: var(--font-serif);
            font-size: 1.05rem;
            color: #c8c8c8;
            text-align: center;
            letter-spacing: 0.06em;
            outline: none;
            transition: border-color 0.4s ease;
            caret-color: #7a7a7a;
        }
        #questionInput::placeholder {
            color: #3e3e3e;
            letter-spacing: 0.08em;
            font-style: italic;
        }
        #questionInput:focus {
            border-bottom-color: #5a5a5a;
        }
        #submitBtn {
            background: transparent;
            border: 1px solid #2e2e2e;
            color: #8a8a8a;
            font-family: var(--font-serif);
            font-size: 1rem;
            letter-spacing: 0.2em;
            padding: 0.55rem 2.4rem;
            cursor: pointer;
            transition: all 0.4s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #submitBtn:hover {
            border-color: #5a5a5a;
            color: #c8c8c8;
            box-shadow: 0 0 30px rgba(180, 180, 180, 0.04);
        }
        #submitBtn:active {
            border-color: #7a7a7a;
            color: #e0e0e0;
        }

        /* 占卜卡位区域 */
        #cardsSection {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.4rem;
            width: 100%;
            max-width: 420px;
            pointer-events: auto;
            opacity: 1;
            transform: none;
            margin-top: 1.8rem;
        }

        .card {
            width: 100%;
            border: 1px solid #1f1f1f;
            padding: 1.4rem 1.2rem 1.6rem;
            cursor: pointer;
            position: relative;
            transition: border-color 0.5s ease, box-shadow 0.5s ease;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
        }
        .card:hover {
            border-color: #3a3a3a;
            box-shadow: 0 0 40px rgba(100, 100, 100, 0.03);
        }
        .card.revealed {
            cursor: default;
            border-color: #2a2a2a;
        }
        .card.revealed:hover {
            border-color: #2a2a2a;
            box-shadow: none;
        }
        .card-label {
            font-family: var(--font-sans);
            font-size: 0.7rem;
            letter-spacing: 0.25em;
            color: #4a4a4a;
            text-transform: uppercase;
            margin-bottom: 0.7rem;
            transition: color 0.5s ease;
            pointer-events: none;
        }
        .card.revealed .card-label {
            color: #6a6a6a;
        }
        .card-content {
            font-size: 1.5rem;
            letter-spacing: 0.12em;
            color: transparent;
            min-height: 2.2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            transition: color 0.8s ease;
            position: relative;
            text-align: center;
            line-height: 1.3;
            width: 100%;
        }
        .card-content.revealing .word-text {
            animation: wordReveal 2s ease-out forwards;
        }
        .card-content.revealed-word .word-text {
            color: #ffffff;
        }

        .word-text {
            position: relative;
            z-index: 1;
        }

        .word-meaning {
            font-size: 0.7rem;
            letter-spacing: 0.05em;
            color: #4a4a4a;
            margin-top: 0.5rem;
            opacity: 0;
            transform: translateY(5px);
            transition: opacity 0.8s ease, transform 0.8s ease;
            font-family: var(--font-serif);
            font-style: italic;
            line-height: 1.5;
            text-align: center;
            max-width: 90%;
        }
        .word-meaning.visible {
            opacity: 0.7;
            transform: translateY(0);
        }

        .card-placeholder {
            width: 10px;
            height: 10px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            opacity: 0.35;
            transition: opacity 0.4s ease;
        }
        .card-placeholder::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 6px;
            height: 6px;
            border: 1px solid #3a3a3a;
            border-radius: 50%;
        }
        .card.revealed .card-placeholder {
            opacity: 0;
        }

        @keyframes wordReveal {
            0% {
                opacity: 0;
                filter: blur(12px);
                transform: translateY(10px);
                text-shadow: 0 0 28px var(--glow-color, #888), 0 0 60px var(--glow-color, #888);
                color: rgba(255, 255, 255, 0);
            }
            35% {
                opacity: 0.45;
                filter: blur(6px);
                transform: translateY(4px);
                text-shadow: 0 0 18px var(--glow-color, #888), 0 0 40px var(--glow-color, #888);
                color: rgba(255, 255, 255, 0.5);
            }
            70% {
                opacity: 0.85;
                filter: blur(2px);
                transform: translateY(1px);
                text-shadow: 0 0 6px var(--glow-color, #888), 0 0 12px var(--glow-color, #666);
                color: rgba(255, 255, 255, 0.9);
            }
            100% {
                opacity: 1;
                filter: blur(0);
                transform: translateY(0);
                text-shadow: 0 0 0 transparent;
                color: #ffffff;
            }
        }

        #resetSection {
            opacity: 0;
            transform: translateY(10px);
            pointer-events: none;
            transition: opacity 0.6s ease, transform 0.6s ease;
            margin-top: 1.8rem;
        }
        #resetSection.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        #resetBtn {
            background: transparent;
            border: 1px solid #1f1f1f;
            color: #5a5a5a;
            font-family: var(--font-serif);
            font-size: 0.85rem;
            letter-spacing: 0.18em;
            padding: 0.5rem 2rem;
            cursor: pointer;
            transition: all 0.5s ease;
            -webkit-tap-highlight-color: transparent;
        }
        #resetBtn:hover {
            border-color: #4a4a4a;
            color: #b0b0b0;
            box-shadow: 0 0 25px rgba(150, 150, 150, 0.03);
        }
        #resetBtn:active {
            border-color: #6a6a6a;
            color: #d0d0d0;
        }

        .bottom-ornament {
            margin-top: 2.5rem;
            width: 40px;
            height: 1px;
            background: #1f1f1f;
            position: relative;
            opacity: 0.6;
        }
        .bottom-ornament::after {
            content: '';
            position: absolute;
            top: -3px;
            left: 50%;
            transform: translateX(-50%);
            width: 1px;
            height: 7px;
            background: #1f1f1f;
        }

        @media (max-width: 480px) {
            #mainContainer {
                padding: 2rem 1rem 1.5rem;
            }
            .card {
                padding: 1.1rem 0.9rem 1.3rem;
                min-height: 90px;
            }
            .card-content {
                font-size: 1.3rem;
            }
            .word-meaning {
                font-size: 0.65rem;
            }
            #questionInput {
                font-size: 0.95rem;
            }
            .title {
                font-size: 2rem;
                letter-spacing: 0.28em;
            }
        }
        @media (min-width: 768px) {
            .card {
                padding: 1.6rem 1.5rem 1.8rem;
                min-height: 110px;
            }
            .card-content {
                font-size: 1.65rem;
            }
            .word-meaning {
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>

    <div id="flashOverlay"></div>

    <!-- 音频元素 -->
    <audio id="bgm" loop preload="auto">
        <source src="bgm.mp3" type="audio/mpeg">
        您的浏览器不支持音频播放。
    </audio>

    <!-- 音频控制按钮 -->
    <div class="audio-control" id="audioToggle" title="音乐开关">
        <!-- 播放图标（静音时显示） -->
        <svg class="play-icon" viewBox="0 0 24 24" width="18" height="18">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
        <!-- 静音图标（播放时显示） -->
        <svg class="mute-icon" viewBox="0 0 24 24" width="18" height="18">
            <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
        </svg>
    </div>

    <div id="mainContainer">
        <h1 class="title">涅尔卡密</h1>
        <div class="subtitle-ornament"></div>

        <div id="inputSection">
            <div class="input-wrapper">
                <input
                type="text"
                id="questionInput"
                placeholder="询问伟大的命运"
                maxlength="120"
                autocomplete="off"
                >
            </div>
            <button id="submitBtn">询问</button>
        </div>

        <div id="cardsSection"></div>

        <div id="resetSection">
            <button id="resetBtn">再次询问</button>
        </div>

        <div class="bottom-ornament"></div>
    </div>

    <script>
        (function() {
            // ==================== 音频控制 ====================
            const bgm = document.getElementById('bgm');
            const audioToggle = document.getElementById('audioToggle');
            let audioStarted = false;

            function tryAutoPlay() {
                const playPromise = bgm.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        audioStarted = true;
                        audioToggle.classList.remove('muted');
                    }).catch(() => {
                        // 自动播放被阻止，显示静音状态，等待用户手势
                        audioToggle.classList.add('muted');
                    });
                }
            }

            // 尝试在页面加载后播放
            window.addEventListener('load', () => {
                tryAutoPlay();
            });

            // 也可在第一次用户交互时尝试恢复播放（针对某些严格浏览器）
            document.addEventListener('click', function resumeAudio() {
                if (!audioStarted) {
                    bgm.play().then(() => {
                        audioStarted = true;
                        audioToggle.classList.remove('muted');
                    }).catch(() => {});
                }
                document.removeEventListener('click', resumeAudio);
            }, { once: true });

            // 按钮点击切换静音/播放
            audioToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                if (bgm.paused) {
                    bgm.play().then(() => {
                        audioStarted = true;
                        audioToggle.classList.remove('muted');
                    }).catch(() => {
                        // 播放失败（例如用户未交互），保持静音图标
                        audioToggle.classList.add('muted');
                    });
                } else {
                    bgm.pause();
                    audioToggle.classList.add('muted');
                }
            });

            // ==================== 72词数据 ====================
            const wordsData = [
                { name: '知识', element: '火', color: '#e02d2d', meaning: '恒定，唯一，星云，放下的船锚' },
                { name: '灵魂', element: '火', color: '#e02d2d', meaning: '此在，飘渺，梨核，蜕皮的新蝉' },
                { name: '心脏', element: '火', color: '#e02d2d', meaning: '迸动，炎症，渴求，高贵而强壮' },
                { name: '尖刺', element: '火', color: '#e02d2d', meaning: '保护，误解，争吵，他人即地狱' },
                { name: '理念', element: '火', color: '#e02d2d', meaning: '标准，平庸，铅字，总结和陈述' },
                { name: '创世', element: '火', color: '#e02d2d', meaning: '开端，伟力，突然，不朽的功业' },
                { name: '直觉', element: '水', color: '#4c60e0', meaning: '刹那，敏锐，絮语，两难的决断' },
                { name: '象征', element: '水', color: '#4c60e0', meaning: '缩影，回答，未来梦，不自知的' },
                { name: '肾脏', element: '水', color: '#4c60e0', meaning: '净化，纵欲，向导，绽放的水仙' },
                { name: '懒散', element: '水', color: '#4c60e0', meaning: '拖延计划，兴趣大减，悠然生活' },
                { name: '流转', element: '水', color: '#4c60e0', meaning: '嬗变，不适应，发展，稍纵即逝' },
                { name: '丰盈', element: '水', color: '#4c60e0', meaning: '满溢，恩惠，如愿，增多已有的' },
                { name: '理性', element: '土', color: '#e09a02', meaning: '冷漠，算术，量程，考虑过多而失算' },
                { name: '背景', element: '土', color: '#e09a02', meaning: '白噪声，温热的辐射，拥抱与安抚' },
                { name: '脾脏', element: '土', color: '#e09a02', meaning: '血液，伤痛，力量向外界流失，奉献' },

                { name: '情绪', element: '风', color: '#46e0b5', meaning: '难以捉摸，承受过度而释放，无根基的爱情' },
                { name: '疯狂', element: '风', color: '#46e0b5', meaning: '不着调，大胆的尝试，睡眠不足，身不由己' },

                { name: '车骑', element: '风', color: '#46e0b5', meaning: '疾速，胜利，决心与行动，众人辅佐，确定方向' },

                { name: '谜题', element: '以太', color: '#d5e0d8', meaning: '疑惑，矛盾，驻足不前，顿悟与突破' },

                { name: '深渊', element: '虚空', color: '#3b017d', meaning: '坠落的恐惧，谨慎，错误的直觉，做噩梦' },
                { name: '肺腔', element: '虚空', color: '#3b017d', meaning: '波澜不惊，友情无法加深，慢性病，财产损失' },
                { name: '氛围', element: '虚空', color: '#3b017d', meaning: '格格不入，繁琐的规矩，模仿，有所察觉' },
                { name: '影子', element: '虚空', color: '#3b017d', meaning: '长久的黑暗，不可预测，命运改变，亲密无间' },

                { name: '脉络', element: '以太', color: '#d5e0d8', meaning: '蝴蝶效应，小心不留下痕迹，巧合，计划赶不上变化' },
                { name: '领悟', element: '以太', color: '#d5e0d8', meaning: '创立门派，前无古人，表达欲，教育' },
                { name: '忧郁', element: '虚空', color: '#3b017d', meaning: '稀薄，缺少原动力，感伤，拖延工作' },
                { name: '往复', element: '虚空', color: '#3b017d', meaning: '后必再行，犯同样的错，无用功，难以翻身' },
                { name: '肚肠', element: '虚空', color: '#3b017d', meaning: '被剽窃，因欲望而挥霍，虚症，口是心非' },
                { name: '孤独', element: '虚空', color: '#3b017d', meaning: '自力更生，伙伴陷入困境，不能分享的想法' },
                { name: '终末', element: '虚空', color: '#3b017d', meaning: '永远改变，恩怨已了，戛然而止，斗志不足' },
                { name: '时间', element: '虚空', color: '#3b017d', meaning: '成熟，衰老，征求老人的意见，条条大路通罗马' },
            ];

            // ==================== DOM元素 ====================
            const flashOverlay = document.getElementById('flashOverlay');
            const inputSection = document.getElementById('inputSection');
            const questionInput = document.getElementById('questionInput');
            const submitBtn = document.getElementById('submitBtn');
            const cardsSection = document.getElementById('cardsSection');
            const resetSection = document.getElementById('resetSection');
            const resetBtn = document.getElementById('resetBtn');

            let drawnWords = [];
            let revealedCount = 0;
            let isQuestionAsked = false;
            let activeFlashTimer = null;

            function getRandomWord() {
                const index = Math.floor(Math.random() * wordsData.length);
                return wordsData[index];
            }
            function drawThreeWords() {
                return [getRandomWord(), getRandomWord(), getRandomWord()];
            }
            function triggerFlash(colorHex) {
                if (activeFlashTimer) {
                    clearTimeout(activeFlashTimer);
                    flashOverlay.style.transition = 'none';
                    flashOverlay.style.backgroundColor = 'transparent';
                    void flashOverlay.offsetWidth;
                }
                const rgba = hexToRgba(colorHex, 0.22);
                flashOverlay.style.transition = 'none';
                flashOverlay.style.backgroundColor = 'transparent';
                void flashOverlay.offsetWidth;
                flashOverlay.style.transition = 'background-color 2s ease';
                flashOverlay.style.backgroundColor = rgba;
                const fadeOutTimer = setTimeout(() => {
                    flashOverlay.style.backgroundColor = 'transparent';
                    activeFlashTimer = setTimeout(() => { activeFlashTimer = null; }, 2100);
                }, 2000);
                activeFlashTimer = fadeOutTimer;
            }
            function hexToRgba(hex, alpha) {
                const r = parseInt(hex.slice(1, 3), 16);
                const g = parseInt(hex.slice(3, 5), 16);
                const b = parseInt(hex.slice(5, 7), 16);
                return `rgba(${r},${g},${b},${alpha})`;
            }

            const cardLabels = ['本因', '进行', '指引'];
            function createCards() {
                cardsSection.innerHTML = '';
                revealedCount = 0;
                cardLabels.forEach((label, index) => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.setAttribute('data-index', index);
                    const labelEl = document.createElement('span');
                    labelEl.className = 'card-label';
                    labelEl.textContent = label;
                    const contentEl = document.createElement('div');
                    contentEl.className = 'card-content';
                    const wordTextEl = document.createElement('span');
                    wordTextEl.className = 'word-text';
                    contentEl.appendChild(wordTextEl);
                    const meaningEl = document.createElement('span');
                    meaningEl.className = 'word-meaning';
                    contentEl.appendChild(meaningEl);
                    const placeholder = document.createElement('div');
                    placeholder.className = 'card-placeholder';
                    contentEl.appendChild(placeholder);
                    card.appendChild(labelEl);
                    card.appendChild(contentEl);
                    card.addEventListener('click', function(e) {
                        handleCardClick(index, card, contentEl, wordTextEl, meaningEl);
                    });
                    cardsSection.appendChild(card);
                });
            }

            function handleCardClick(index, card, contentEl, wordTextEl, meaningEl) {
                if (!isQuestionAsked || card.classList.contains('revealed')) return;
                card.classList.add('revealed');
                const wordObj = drawnWords[index];
                const placeholder = contentEl.querySelector('.card-placeholder');
                if (placeholder) placeholder.remove();
                contentEl.style.setProperty('--glow-color', wordObj.color);
                triggerFlash(wordObj.color);
                wordTextEl.textContent = wordObj.name;
                contentEl.classList.add('revealing');
                wordTextEl.style.animation = 'none';
                void wordTextEl.offsetWidth;
                wordTextEl.style.animation = 'wordReveal 2s ease-out forwards';
                const onAnimationEnd = () => {
                    wordTextEl.removeEventListener('animationend', onAnimationEnd);
                    contentEl.classList.remove('revealing');
                    contentEl.classList.add('revealed-word');
                    revealedCount++;
                    checkAllRevealed();
                };
                wordTextEl.addEventListener('animationend', onAnimationEnd);
                setTimeout(() => {
                    if (contentEl.classList.contains('revealing')) {
                        wordTextEl.removeEventListener('animationend', onAnimationEnd);
                        contentEl.classList.remove('revealing');
                        contentEl.classList.add('revealed-word');
                        revealedCount++;
                        checkAllRevealed();
                    }
                }, 2500);
                setTimeout(() => {
                    meaningEl.textContent = wordObj.meaning;
                    meaningEl.classList.add('visible');
                }, 4200);
            }

            function checkAllRevealed() {
                if (revealedCount >= 3) resetSection.classList.add('visible');
            }
            function startDivination() {
                drawnWords = drawThreeWords();
                isQuestionAsked = true;
                inputSection.classList.add('hidden');
                resetSection.classList.remove('visible');
            }
            function resetDivination() {
                isQuestionAsked = false;
                createCards();
                inputSection.classList.remove('hidden');
                resetSection.classList.remove('visible');
                questionInput.value = '';
                if (activeFlashTimer) {
                    clearTimeout(activeFlashTimer);
                    activeFlashTimer = null;
                    flashOverlay.style.transition = 'none';
                    flashOverlay.style.backgroundColor = 'transparent';
                }
                setTimeout(() => questionInput.focus(), 500);
            }

            submitBtn.addEventListener('click', startDivination);
            questionInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') { e.preventDefault(); startDivination(); }
            });
            resetBtn.addEventListener('click', resetDivination);

            // 初始化
            isQuestionAsked = false;
            createCards();
            inputSection.classList.remove('hidden');
            resetSection.classList.remove('visible');
            setTimeout(() => questionInput.focus(), 600);
        })();
    </script>
